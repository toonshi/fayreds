# Render Blueprint: Next.js web service + Postgres.
# Payment/SMS/email keys are left out on purpose, so those services run in demo mode
# until the real keys are added in the Render dashboard (Environment tab).
services:
  - type: web
    name: fayreds
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    # Migrations run at start because pre-deploy commands need a paid plan.
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: fayreds-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: fayreds-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: MPESA_CALLBACK_SECRET
        generateValue: true
      - key: SITE_URL
        value: https://fayreds.onrender.com
      - key: CONSULTATION_PRICE_USD
        value: "100"
      - key: CONSULTATION_PRICE_KES
        value: "13000"
      - key: FAITH_ALERT_PHONE
        value: "+254701484995"
      - key: MPESA_ENV
        value: sandbox
      - key: MPESA_SHORTCODE
        value: "174379"
      - key: MPESA_TRANSACTION_TYPE
        value: CustomerPayBillOnline

databases:
  - name: fayreds-db
    plan: free
    databaseName: fayreds
    user: fayreds
